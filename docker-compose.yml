services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hajj_umrah
      POSTGRES_PASSWORD: hajj_umrah_dev_password
      POSTGRES_DB: hajj_umrah_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hajj_umrah -d hajj_umrah_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
