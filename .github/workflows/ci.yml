name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hajj_umrah
          POSTGRES_PASSWORD: hajj_umrah_dev_password
          POSTGRES_DB: hajj_umrah_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hajj_umrah -d hajj_umrah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@v4
        # No `version:` here — pnpm/action-setup auto-detects and installs
        # the version pinned in package.json's "packageManager" field
        # (pnpm@9.4.0). Setting both `version:` and a packageManager field
        # causes the action to fail with "Multiple versions of pnpm specified".

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Enable btree_gist on the CI test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=hajj_umrah_dev_password psql -h localhost -p 5433 -U hajj_umrah -d hajj_umrah_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Run migrations against the CI test database
        env:
          DATABASE_URL: postgres://hajj_umrah:hajj_umrah_dev_password@localhost:5433/hajj_umrah_test
        run: pnpm db:migrate

      - name: Integration tests
        env:
          DATABASE_URL: postgres://hajj_umrah:hajj_umrah_dev_password@localhost:5433/hajj_umrah_test
          NUXT_SESSION_PASSWORD: ci-test-session-password-at-least-32-characters
          APP_ENV: staging
        run: pnpm exec vitest run --config vitest.integration.config.ts
